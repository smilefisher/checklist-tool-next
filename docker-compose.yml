# 本地一键运行：MySQL 8 + 应用容器
#   ./scripts/local-docker.sh up        # 构建并启动（首次会自动建表并写入示例数据）
#   ./scripts/local-docker.sh down      # 停止（保留数据库数据）
#   ./scripts/local-docker.sh reset     # 停止并删除数据库数据卷
# 也可以直接用：sudo docker compose up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: checklist-tool-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_NAME:-checklist}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主机端口用 3307，避免和本机已有的 MySQL 冲突
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时执行，顺序按文件名
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checklist-tool-local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      # 需要连宿主机上的 MySQL 时可用 DB_HOST=host.docker.internal
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-checklist}
      HOSTNAME: 0.0.0.0
      PORT: "4399"
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-4399}:4399"

volumes:
  mysql-data:
